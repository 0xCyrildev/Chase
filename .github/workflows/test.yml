name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Invariant fixtures
        run: ./scripts/run-tests.sh
      - name: Triage fixtures
        run: ./scripts/run-triage-tests.sh
      - name: Agent, budget and CLI regression
        run: npx tsx scripts/agent-tests.ts
      - name: Budget unit checks
        run: npx tsx scripts/test-budget.ts
